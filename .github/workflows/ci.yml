name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Both jobs always run (no path filters) so required checks exist for
# gomod, terraform, and github-actions Dependabot PRs.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOLANGCI_LINT_VERSION: v2.13.1
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Go fmt check
        run: |
          fmt_out=$(gofmt -s -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::run gofmt -s on these files:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Go mod verify
        run: go mod verify

      - name: Go vet
        run: go vet ./...

      - name: golangci lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout 4m --config .golangci.yaml

      - name: Test (race)
        run: go test ./... -race

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          # Match local CLI. 1.14.0 on linux rejected darwin-only h1 hashes
          # in .terraform.lock.hcl during validate.
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.61.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        # Lock file must include h1 hashes for linux_* (CI) as well as darwin_*.
        # Otherwise validate rejects unpacked providers: "cached package does
        # not match any of the checksums recorded in the dependency lock file".
        # Refresh with: terraform -chdir=terraform providers lock -platform=linux_amd64 -platform=linux_arm64 -platform=darwin_amd64 -platform=darwin_arm64
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        run: terraform validate -no-color

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint
